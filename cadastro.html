<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar perfil — Peneiras On</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* Alturas medidas pelo JS (cabeçalho e bloco de score) — nada chumbado */
    :root { --header-h: 65px; --cad-head-h: 0px; }
    /* Ao focar um campo por Tab, o navegador rola deixando espaço para o bloco
       sticky em cima e para a barra fixa embaixo, em vez de esconder o campo. */
    html { scroll-padding-top: calc(var(--header-h) + var(--cad-head-h) + 16px); scroll-padding-bottom: 110px; }
    /* A página ocupa a viewport: a barra de ações encosta no fim do conteúdo
       mesmo no passo curto; passos longos rolam normalmente. */
    main[data-screen] { min-height: calc(100vh - var(--header-h)); min-height: calc(100dvh - var(--header-h)); display:flex; flex-direction:column; }
    .cad-body { flex:1; }
    /* Bloco de score gruda sob o cabeçalho; em telas baixas vira estático para
       não comer a viagem útil junto com a barra fixa. */
    .cad-head { position:sticky; top:var(--header-h); z-index:5; border-bottom:1px solid var(--line); background:var(--bg); }
    @media (max-height:640px) { .cad-head { position:static; } html { scroll-padding-top: calc(var(--header-h) + 16px); } }
    /* Barra de ações do wizard, fixa no rodapé da viewport (veio de atleta.html) */
    .cad-footer { position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--line); padding:16px 32px; z-index:20; }
    @media (max-width:900px) {
      .cad-footer { padding:12px 20px; }
    }
  </style>
</head>
<body data-page="cadastro.html">

  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div data-simple-header></div>

  <main id="conteudo" tabindex="-1" data-screen></main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/cadastro.js"></script>
</body>
</html>
