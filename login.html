<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Peneiras On</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/tailwind.css">
</head>
<body>

  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div data-simple-header></div>

  <div class="login-grid">
    <!-- Lado: branding -->
    <aside class="login-side" aria-hidden="true">
      <div class="login-side__bg pele-bg"></div>
      <div class="login-side__scrim"></div>
      <div class="relative">
        <div class="flex items-center gap-3">
          <span class="w-6 h-px bg-accent"></span>
          <span class="tag tag--accent" data-side-tag></span>
        </div>
        <h1 class="display text-fluid-h1 leading-display mt-6 mb-0 mx-0" data-side-title></h1>
        <p class="lead mt-6 max-w-hero-p text-bg/78" data-side-sub></p>
      </div>
      <div class="relative flex flex-col gap-2.5" data-side-tips></div>
    </aside>

    <!-- Lado: formulário -->
    <main id="conteudo" tabindex="-1" class="login-form">
      <div class="role-tabs">
        <a class="role-tab" href="login.html?tipo=jogador" data-role="jogador">Jogador</a>
        <a class="role-tab" href="login.html?tipo=olheiro" data-role="olheiro">Olheiro</a>
        <a class="role-tab" href="login.html?tipo=academia" data-role="academia">Academia</a>
      </div>

      <div class="kicker uppercase" data-form-kicker></div>
      <h2 class="display h3 mt-1.5 mb-6 mx-0">Bem-vindo<br>de volta.</h2>
      <p class="mono -mt-2 mb-6 mx-0 py-3 px-3.5 bg-accent-soft border border-line-soft text-12 normal-case tracking-normal" data-event-context hidden></p>

      <form class="flex flex-col gap-4" data-login-form>
        <label class="field">
          <div class="field__label"><span data-id-label></span></div>
          <input class="input" data-id-input autocomplete="username">
        </label>
        <label class="field">
          <div class="field__label"><span>Senha</span></div>
          <div class="relative">
            <input class="input" type="password" placeholder="••••••••" autocomplete="current-password" data-pwd>
            <button type="button" data-toggle-pwd class="absolute right-2 top-1/2 -translate-y-1/2 h-8 py-0 px-2.5 bg-transparent border-0 cursor-pointer font-mono text-10 uppercase tracking-label text-ink-soft">Mostrar</button>
          </div>
        </label>
        <div class="flex justify-between items-center">
          <label class="flex items-center gap-2 text-13 cursor-pointer"><input class="w-4 h-4 accent-accent" type="checkbox" checked>Manter conectado</label>
          <a href="recuperar.html" class="text-13 text-ink underline underline-offset-3">Esqueci a senha</a>
        </div>
        <button type="submit" class="btn btn--primary btn--lg btn--full">Entrar →</button>

        <div class="flex items-center gap-3 my-3 mx-0">
          <div class="flex-1 h-px bg-line-soft"></div>
          <span class="mono text-mute">Ou</span>
          <div class="flex-1 h-px bg-line-soft"></div>
        </div>
        <button type="button" data-google class="btn btn--ghost btn--lg btn--full font-body font-semibold normal-case tracking-normal gap-2.5">
          <span class="w-4.5 h-4.5 bg-white border border-ink rounded-full inline-flex items-center justify-center font-display font-black text-11">G</span>
          Entrar com Google
        </button>
      </form>

      <div class="mt-8 pt-5 border-t border-t-line-soft flex justify-between items-center flex-wrap gap-3" data-bottom-row></div>

      <p class="mono text-mute mt-6 normal-case leading-copy">Ao entrar, você concorda com nossos <a href="privacidade.html" class="text-ink">Termos</a> e <a href="privacidade.html" class="text-ink">Política de Privacidade</a>.</p>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
